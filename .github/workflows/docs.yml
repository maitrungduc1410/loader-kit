name: Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'spec/**'
      - 'web/**'
      - 'SPEC.md'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'spec/**'
      - 'web/**'
      - 'SPEC.md'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # A newer pull request build replaces an older one, but a running Pages deploy is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # VitePress reads the git history for "last updated" dates.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The site serves spec/schema.json, so it must not deploy a stale one.
      - name: Generated files are up to date
        run: npm run check:generated

      - name: Typecheck docs
        run: npm run typecheck --workspace loader-kit-docs

      - name: Build docs
        run: npm run docs:build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
