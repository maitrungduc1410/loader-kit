name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The release workflow runs CI first and publishes only when every job passed.
  workflow_call:
  # Pushes made with GITHUB_TOKEN do not trigger pull_request runs, so the release workflow
  # dispatches CI on the release branch to give its pull request checks.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spec:
    name: Spec and web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generated files are up to date
        run: npm run check:generated

      - run: npm run typecheck

      - run: npm test

      - name: Build and pack @loader-kit/spec and @loader-kit/web
        run: |
          npm run build
          npm pack --dry-run --workspace @loader-kit/spec --workspace @loader-kit/web

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test, build and publish to the local Maven repository
        run: ./gradlew :loaderkit-core:testDebugUnitTest assembleRelease publishToMavenLocal --stacktrace

  apple-linux:
    name: Apple core (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v7

      - run: swift build

      - run: swift test

  apple:
    name: Apple (iOS, macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Test on macOS
        run: swift test

      - name: Build for iOS
        run: >-
          xcodebuild build -quiet -scheme LoaderKit -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

      - name: Lint the pod
        run: pod lib lint LoaderKit.podspec --allow-warnings

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test LoaderKit.Core
        run: dotnet test windows/LoaderKit.Core.Tests -c Release

      - name: Build and pack
        shell: bash
        run: |
          version="$(node -p "require('./windows/package.json').version")"
          dotnet pack windows/LoaderKit.Core -c Release -p:Version="$version" -o artifacts
          dotnet pack windows/LoaderKit.WinUI -c Release -p:Version="$version" -o artifacts
          ls artifacts
